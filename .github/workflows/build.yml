name: build-desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_name: inmocore
          - platform: ubuntu-latest
            artifact_name: inmocore
          - platform: windows-latest
            artifact_name: inmocore.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Build release
        run: cargo build --release

      - name: Subir binario como artifact
        uses: actions/upload-artifact@v4
        with:
          name: inmocore-${{ matrix.platform }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
